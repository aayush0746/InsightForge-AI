name: Keep Backend Warm

on:
  schedule:
    # Runs every 12 minutes to keep the cloud backend warm
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://insightforge-backend-production.up.railway.app/api/health")
          echo "Railway Backend Health Status: $response"
