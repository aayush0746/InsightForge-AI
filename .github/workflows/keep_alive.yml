name: Keep Backend Warm

on:
  schedule:
    # Runs every 12 minutes to keep the Render free-tier instance warm and prevent the 15-minute inactivity sleep
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://insightforge-backend-99g3.onrender.com/api/health")
          echo "Render Backend Health Status: $response"
